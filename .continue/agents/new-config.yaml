name: Inline autotab qwen 2.5
version: 1.0.0
schema: v1
models:
  - name: "LM Studio (Local)"
    provider: openai
    model: "qwen2.5-coder-3b-instruct"
    apiBase: "http://localhost:1234/v1"
    # Aggiungiamo i ruoli espliciti
    roles:
      - chat
      - edit
      - autocomplete

tabAutocompleteModel:
  name: "Autocomplete"
  provider: openai
  model: "qwen2.5-coder-3b-instruct" # o quello che hai caricato
  apiBase: "http://localhost:1234/v1"
  # ISTRUZIONI CRUCIALI
  useFillInTheMiddle: true 

tabAutocompleteOptions:
  maxPromptTokens: 512 # Non esagerare, o diventa lento
  debounceDelay: 150   # Tempo di attesa dopo che smetti di digitare
  temperature: 0.1     # BASSA! Più è bassa, meno inventa commenti a caso